<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a Localité group</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #172033; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 32rem; padding: 2.5rem; text-align: center; }
      h1 { font-size: 2rem; margin: 0 0 1rem; }
      p { line-height: 1.55; margin: 0 0 1.5rem; }
      button { border: 0; border-radius: .8rem; background: #172033; color: white; cursor: pointer; font: inherit; font-weight: 700; padding: .95rem 1.25rem; }
      button + button { background: #e2e8f0; color: #172033; margin-top: .75rem; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Join a Localité group</h1>
      <p id="message">Preparing your invitation…</p>
      <button id="open-app" class="hidden" type="button">Open Localité</button>
      <button id="install" class="hidden" type="button">Get Localité</button>
    </main>
    <script>
      const playPackage = 'com.localitylocalite.app';
      const appStoreUrl = 'https://apps.apple.com/us/app/localit%C3%A9/id6773537790';
      const tokenMatch = window.location.pathname.match(/^\/invite\/group\/([^/]+)\/?$/);
      const token = tokenMatch ? decodeURIComponent(tokenMatch[1]) : '';
      const message = document.getElementById('message');
      const openApp = document.getElementById('open-app');
      const install = document.getElementById('install');

      if (!token) {
        message.textContent = 'This group invitation is invalid.';
      } else if (/Android/i.test(navigator.userAgent)) {
        const referrer = encodeURIComponent(`group_invite_token=${encodeURIComponent(token)}`);
        window.location.replace(`https://play.google.com/store/apps/details?id=${playPackage}&referrer=${referrer}`);
      } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        const appUrl = `localityspike://invite/group/${encodeURIComponent(token)}`;
        let fallbackTimer = null;

        const openInstalledApp = () => {
          message.textContent = 'Opening Localité…';
          window.location.assign(appUrl);
        };

        const cancelFallback = () => {
          if (fallbackTimer) {
            clearTimeout(fallbackTimer);
            fallbackTimer = null;
          }
        };

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) cancelFallback();
        });
        window.addEventListener('pagehide', cancelFallback);

        openApp.classList.remove('hidden');
        install.classList.remove('hidden');
        openApp.addEventListener('click', openInstalledApp);
        install.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(window.location.href); } catch (_) { /* Re-tapping the invite after install also works. */ }
          window.location.assign(appStoreUrl);
        });

        message.textContent = 'Opening your group in Localité…';
        fallbackTimer = setTimeout(() => {
          if (document.visibilityState === 'visible') {
            message.textContent = 'If Localité did not open, install it from the App Store.';
            window.location.replace(appStoreUrl);
          }
        }, 1800);

        openInstalledApp();
      } else {
        message.textContent = 'Open this invitation on your Android phone or iPhone to join the group.';
      }
    </script>
  </body>
</html>
